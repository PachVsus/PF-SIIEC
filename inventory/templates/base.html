<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventario{% endblock %} · PF-SIIEC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a href="{{ url_for('index') }}">PF-SIIEC <span>/ Inventario</span></a><span>Infraestructura del Desarrollo Continuo</span></header>
<main>
{% for category, message in get_flashed_messages(with_categories=true) %}
<div class="notice {{ category }}" role="status">{{ message }}</div>
{% endfor %}
{% block content %}{% endblock %}
</main>
<footer>Control de existencias · Versión {{ config.APP_VERSION }}</footer>
</body>
</html>
